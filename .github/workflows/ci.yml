name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: oven-sh/setup-bun@v2
    - uses: actions/checkout@v6
    - id: bait_setup
      name: Run Action
      uses: ./
    - name: Check output
      run: |
        echo "Action output is ${{ steps.bait_setup.outputs.version }}"
        bait version
